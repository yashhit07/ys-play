name: YS PLAY Automatic Results

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  generate-result:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Generate result
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node <<'EOF'
          (async () => {

          const { initializeApp, cert } = require("firebase-admin/app");
          const { getFirestore } = require("firebase-admin/firestore");

          const serviceAccount = JSON.parse(
            process.env.FIREBASE_SERVICE_ACCOUNT
          );

          initializeApp({
            credential: cert(serviceAccount)
          });

          const db = getFirestore();

          function getIST() {
            const parts = new Intl.DateTimeFormat("en-GB", {
              timeZone: "Asia/Kolkata",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
              hourCycle: "h23"
            }).formatToParts(new Date());

            const get = (name) =>
              parts.find(p => p.type === name).value;

            return {
              year: Number(get("year")),
              month: Number(get("month")),
              day: Number(get("day")),
              hour: Number(get("hour")),
              minute: Number(get("minute"))
            };
          }

          function pad(n) {
            return String(n).padStart(2, "0");
          }

          function formatTime(hour, minute) {
            const suffix = hour >= 12 ? "PM" : "AM";

            let h = hour % 12;

            if (h === 0) {
              h = 12;
            }

            return `${h}:${pad(minute)} ${suffix}`;
          }

          function getScheduledSlots(hour, minute) {

            const slots = [];

            // 10:00 AM - 12:45 PM
            if (hour >= 10 && hour < 13) {

              for (let h = 10; h <= hour; h++) {

                for (let m = 0; m < 60; m += 15) {

                  if (h === hour && m > minute) {
                    break;
                  }

                  slots.push({
                    hour: h,
                    minute: m
                  });

                }

              }

            }

            // 2:00 PM - 4:45 PM
            if (hour >= 14 && hour < 17) {

              for (let h = 14; h <= hour; h++) {

                for (let m = 0; m < 60; m += 15) {

                  if (h === hour && m > minute) {
                    break;
                  }

                  slots.push({
                    hour: h,
                    minute: m
                  });

                }

              }

            }

            // 6:00 PM - 8:45 PM
            if (hour >= 18 && hour < 21) {

              for (let h = 18; h <= hour; h++) {

                for (let m = 0; m < 60; m += 15) {

                  if (h === hour && m > minute) {
                    break;
                  }

                  slots.push({
                    hour: h,
                    minute: m
                  });

                }

              }

            }

            // 10:00 PM - 10:50 PM BONUS
            if (hour === 22) {

              for (let m = 0; m < 60; m += 10) {

                if (m > minute) {
                  break;
                }

                slots.push({
                  hour: 22,
                  minute: m
                });

              }

            }

            return slots;
          }

          const now = getIST();

          const dateId =
            `${now.year}-${pad(now.month)}-${pad(now.day)}`;

          const slots =
            getScheduledSlots(now.hour, now.minute);

          if (slots.length === 0) {

            console.log(
              `No game session now. IST: ${pad(now.hour)}:${pad(now.minute)}`
            );

            process.exit(0);
          }

          console.log(
            `Checking ${slots.length} scheduled game(s) for ${dateId}`
          );

          for (const slot of slots) {

            const gameId =
              `${pad(slot.hour)}-${pad(slot.minute)}`;

            const gameTime =
              formatTime(slot.hour, slot.minute);

            const gameRef = db
              .collection("daily_results")
              .doc(dateId)
              .collection("games")
              .doc(gameId);

            const result1 =
              String(
                Math.floor(Math.random() * 100)
              ).padStart(2, "0");

            const result2 =
              String(
                Math.floor(Math.random() * 100)
              ).padStart(2, "0");

            const result3 =
              String(
                Math.floor(Math.random() * 100)
              ).padStart(2, "0");

            await db.runTransaction(async (transaction) => {

              const snap =
                await transaction.get(gameRef);

              if (snap.exists) {

                const old = snap.data();

                if (
                  old.result1 &&
                  old.result1 !== "--" &&
                  old.result2 &&
                  old.result2 !== "--" &&
                  old.result3 &&
                  old.result3 !== "--"
                ) {

                  console.log(
                    `Already exists: ${dateId} ${gameId}`
                  );

                  return;
                }
              }

              transaction.set(
                gameRef,
                {
                  time: gameTime,
                  result1,
                  result2,
                  result3
                },
                { merge: true }
              );

              console.log(
                `Generated ${gameTime}: ${result1} / ${result2} / ${result3}`
              );

            });

          }

          console.log("YS PLAY result check completed.");

          })();
          EOF
