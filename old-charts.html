<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Old Charts | YS PLAY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070912;--purple:#7657ff;--text:#fff;--muted:#8c94aa;--border:rgba(255,255,255,.09)}
body{font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100vh;background:radial-gradient(circle at 15% 5%,rgba(62,105,255,.2),transparent 28%),radial-gradient(circle at 90% 8%,rgba(157,66,255,.2),transparent 30%),radial-gradient(circle at 50% 100%,rgba(42,88,255,.08),transparent 35%),var(--bg);overflow-x:hidden}
.header{height:68px;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:100;background:linear-gradient(180deg,rgba(7,9,18,.95),rgba(7,9,18,.78));border-bottom:1px solid rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 30px rgba(0,0,0,.15)}
.header:after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:110px;height:1px;background:linear-gradient(90deg,transparent,rgba(118,87,255,.9),transparent);box-shadow:0 0 15px rgba(118,87,255,.7)}
.brand{font-size:22px;font-weight:800;letter-spacing:1.2px}.brand span{background:linear-gradient(90deg,#fff,#8b7cff,#67a4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-area{display:flex;justify-content:center;padding:24px 20px 18px;position:relative}.logo-area:before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:150px;height:110px;background:radial-gradient(circle,rgba(118,87,255,.28),transparent 70%);filter:blur(18px)}
.logo-placeholder{width:78px;height:78px;border-radius:24px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;text-align:center;font-size:14px;font-weight:800;line-height:1.1;background:linear-gradient(135deg,#5968ff,#9b4dff);border:1px solid rgba(255,255,255,.17);box-shadow:0 12px 35px rgba(105,78,255,.38),0 0 30px rgba(105,78,255,.14),inset 0 1px 1px rgba(255,255,255,.3);animation:logoFloat 4s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.nav{width:calc(100% - 24px);max-width:900px;margin:0 auto 20px;padding:5px;display:flex;gap:5px;border:1px solid rgba(255,255,255,.09);border-radius:17px;background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.025));backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.nav a{flex:1;max-width:180px;padding:11px 10px;text-align:center;color:#9ca4b8;text-decoration:none;font-size:11px;font-weight:700;border-radius:11px;transition:.25s ease}.nav a:hover{color:#fff;background:rgba(255,255,255,.06)}.nav a.active{color:#fff;background:linear-gradient(135deg,rgba(105,87,255,.45),rgba(75,120,255,.22));border:1px solid rgba(124,108,255,.2);box-shadow:inset 0 1px rgba(255,255,255,.11),0 4px 18px rgba(65,70,255,.2)}
.container{width:calc(100% - 24px);max-width:900px;margin:0 auto}
.page-header{position:relative;overflow:hidden;padding:28px 20px;border-radius:23px;text-align:center;background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.025));border:1px solid var(--border);box-shadow:0 20px 55px rgba(0,0,0,.2)}.page-header:before{content:"";position:absolute;width:200px;height:160px;left:-80px;top:-100px;background:#5268ff;filter:blur(90px);opacity:.14}.page-header:after{content:"";position:absolute;width:200px;height:160px;right:-80px;bottom:-100px;background:#9d4cff;filter:blur(90px);opacity:.13}.page-header-content{position:relative;z-index:2}.page-header h1{font-size:27px;font-weight:800}.page-header p{margin-top:8px;color:var(--muted);font-size:11px;line-height:1.6}
.highlight{display:inline-flex;align-items:center;gap:7px;margin-top:11px;padding:6px 10px;border-radius:9px;color:#dcd8ff;background:rgba(118,87,255,.11);border:1px solid rgba(118,87,255,.15);font-size:9px;font-weight:800;letter-spacing:.4px}.highlight-dot{width:6px;height:6px;border-radius:50%;background:#8f7bff;box-shadow:0 0 9px rgba(143,123,255,.8)}
.date-list{margin-top:20px}.date-card{margin-bottom:12px;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 35px rgba(0,0,0,.14);transition:border-color .3s ease,box-shadow .3s ease}.date-card.open{border-color:rgba(118,87,255,.28);box-shadow:0 15px 45px rgba(0,0,0,.18),0 0 25px rgba(118,87,255,.07)}
.date-button{width:100%;border:none;outline:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:17px;background:transparent;font-family:inherit;text-align:left;transition:background .25s ease}.date-button:hover{background:rgba(255,255,255,.035)}.date-left{display:flex;align-items:center;gap:12px}.date-icon{width:39px;height:39px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:linear-gradient(135deg,rgba(118,87,255,.23),rgba(78,140,255,.1));border:1px solid rgba(124,108,255,.18);font-size:17px}.date-main{font-size:13px;font-weight:800}.date-sub{margin-top:4px;color:#737c91;font-size:9px}.date-badge{display:inline-block;margin-left:5px;padding:3px 6px;border-radius:5px;color:#55e89a;background:rgba(64,229,139,.09);border:1px solid rgba(64,229,139,.1);font-size:7px;vertical-align:middle}.arrow{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:9px;color:#8d96aa;background:rgba(255,255,255,.04);font-size:14px;transition:transform .3s ease,background .3s ease,color .3s ease}.date-card.open .arrow{transform:rotate(180deg);color:#fff;background:rgba(118,87,255,.16)}
.results{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s ease,opacity .3s ease}.date-card.open .results{grid-template-rows:1fr;opacity:1}.results-content{min-height:0;overflow:hidden}.results-inner{padding:0 16px 18px}.results-divider{height:1px;background:rgba(255,255,255,.06);margin-bottom:13px}.results-title{color:#737c91;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.chart-head,.chart-row{display:grid;grid-template-columns:86px 1fr;align-items:center}.chart-head{padding:0 10px 7px;color:#687187;font-size:8px;text-transform:uppercase;letter-spacing:1px}.chart-head .numbers-head{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;text-align:center}.chart-row{min-height:39px;margin-bottom:6px;padding:5px 7px;border-radius:10px;background:linear-gradient(145deg,rgba(118,87,255,.08),rgba(78,140,255,.025));border:1px solid rgba(255,255,255,.05)}.chart-time{font-size:9px;font-weight:800;color:#c9cce0;padding-left:3px}.chart-numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.chart-number{height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:linear-gradient(145deg,rgba(118,87,255,.15),rgba(78,140,255,.06));border:1px solid rgba(124,108,255,.12);font-size:11px;font-weight:800;color:#fff}.empty-chart{text-align:center;padding:18px 10px;color:#6f778c;font-size:9px;border:1px dashed rgba(255,255,255,.07);border-radius:10px}
.loading{text-align:center;padding:22px;color:#737c91;font-size:10px}.error{text-align:center;padding:18px;color:#ff8e9b;font-size:10px}
.footer{max-width:900px;margin:30px auto 0;padding:25px 20px 30px;border-top:1px solid rgba(255,255,255,.05);text-align:center}.footer-links{display:flex;justify-content:center;gap:22px;margin-bottom:14px}.footer-links a{color:#727b91;text-decoration:none;font-size:10px;transition:.2s ease}.footer-links a:hover{color:#fff}.copyright{color:#4f576a;font-size:10px}
@media(max-width:600px){.header{height:62px}.brand{font-size:20px}.logo-area{padding:21px 20px 16px}.logo-placeholder{width:74px;height:74px;border-radius:22px;font-size:13px}.nav{width:calc(100% - 16px);margin-bottom:16px}.nav a{padding:11px 4px;font-size:10px}.container{width:calc(100% - 16px)}.page-header{padding:24px 16px;border-radius:21px}.page-header h1{font-size:24px}.page-header p{font-size:10px}.highlight{font-size:8px}.date-button{padding:15px 13px}.date-icon{width:36px;height:36px;border-radius:10px;font-size:15px}.date-main{font-size:12px}.chart-head,.chart-row{grid-template-columns:72px 1fr}.chart-time{font-size:8px}.chart-number{height:27px;font-size:10px}.chart-numbers,.chart-head .numbers-head{gap:5px}.results-inner{padding:0 12px 15px}.footer-links{gap:15px}}
@media(max-width:360px){.nav a{font-size:9px;padding-left:2px;padding-right:2px}.chart-head,.chart-row{grid-template-columns:66px 1fr}.chart-time{font-size:7px}.chart-number{font-size:9px}}
</style>
</head>
<body>

<header class="header">
<div class="brand"><span>YS PLAY</span></div>
</header>

<div class="logo-area">
<div class="logo-placeholder">YS<br>LOGO</div>
</div>

<nav class="nav">
<a href="index.html">HOME</a>
<a href="old-charts.html" class="active">OLD CHARTS</a>
<a href="how-to-play.html">HOW TO PLAY</a>
</nav>

<main class="container">

<section class="page-header">
<div class="page-header-content">
<h1>Old Charts</h1>
<p>View charts and numbers opened on previous game days.</p>
<div class="highlight">
<span class="highlight-dot"></span>
Last 5 completed days' charts available here
</div>
</div>
</section>

<div id="dateList" class="date-list">
<div class="loading">Loading last 5 charts...</div>
</div>

</main>

<footer class="footer">
<div class="footer-links">
<a href="index.html">HOME</a>
<a href="old-charts.html">OLD CHARTS</a>
<a href="how-to-play.html">HOW TO PLAY</a>
</div>
<div class="copyright">© 2026 YS PLAY. All rights reserved.</div>
</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDv6F9RNNa6XYYPXVumqKr77GSKW2d7Y6U",
authDomain: "ys-play-fc93c.firebaseapp.com",
projectId: "ys-play-fc93c",
storageBucket: "ys-play-fc93c.firebasestorage.app",
messagingSenderId: "931694240335",
appId: "1:931694240335:web:433aa4fe02020066dfc03a"
};

const db = getFirestore(initializeApp(firebaseConfig));
const dateList = document.getElementById("dateList");

function istDate() {
return new Date(
new Date().toLocaleString("en-US", {
timeZone: "Asia/Kolkata"
})
);
}

function isoDate(d) {
return d.getFullYear() + "-" +
String(d.getMonth() + 1).padStart(2, "0") + "-" +
String(d.getDate()).padStart(2, "0");
}

function displayDate(d) {
return new Intl.DateTimeFormat("en-IN", {
timeZone: "Asia/Kolkata",
day: "numeric",
month: "long",
year: "numeric"
}).format(d);
}

function badge(days) {
return days === 1 ? "YESTERDAY" : `${days} DAYS AGO`;
}

function timeMinutes(t) {

if (!t) return 9999;

const p = t.trim().split(/\s+/);
const hm = p[0].split(":").map(Number);

let h = hm[0];
let m = hm[1];

if (p[1] === "PM" && h !== 12) h += 12;
if (p[1] === "AM" && h === 12) h = 0;

return h * 60 + m;
}

function normalizeTime(t) {
return t ? t.trim().replace(/^0(\d):/, "$1:") : t;
}

function rowHTML(game) {

const t = normalizeTime(game.time || "");

return `
<div class="chart-row">

<div class="chart-time">
${t || "—"}
</div>

<div class="chart-numbers">

<div class="chart-number">
${game.result1 ?? "—"}
</div>

<div class="chart-number">
${game.result2 ?? "—"}
</div>

<div class="chart-number">
${game.result3 ?? "—"}
</div>

</div>

</div>
`;
}

async function loadDate(date, days) {

const id = isoDate(date);

const snap = await getDocs(
collection(db, "daily_results", id, "games")
);

const games = [];

snap.forEach(doc => {

const x = doc.data();

if (x && x.time) {
games.push(x);
}

});

games.sort(
(a, b) => timeMinutes(a.time) - timeMinutes(b.time)
);

const rows = games.map(rowHTML).join("");

const card = document.createElement("div");

card.className = "date-card";

card.innerHTML = `

<button class="date-button">

<div class="date-left">

<div class="date-icon">
📅
</div>

<div>

<div class="date-main">

${displayDate(date)}

<span class="date-badge">
${badge(days)}
</span>

</div>

<div class="date-sub">

${games.length}
result${games.length === 1 ? "" : "s"}
available

</div>

</div>

</div>

<div class="arrow">
▼
</div>

</button>

<div class="results">

<div class="results-content">

<div class="results-inner">

<div class="results-divider"></div>

<div class="results-title">

Results • ${
new Intl.DateTimeFormat("en-IN", {
day: "numeric",
month: "long"
}).format(date)
}

</div>

${
games.length
?
`
<div class="chart-head">

<div>TIME</div>

<div class="numbers-head">
<span>1</span>
<span>2</span>
<span>3</span>
</div>

</div>

${rows}
`
:
`
<div class="empty-chart">
No results available for this day.
</div>
`
}

</div>

</div>

</div>

`;

card
.querySelector(".date-button")
.addEventListener("click", () => {

card.classList.toggle("open");

});

return card;
}

async function loadCharts() {

try {

dateList.innerHTML = "";

const today = istDate();

for (let days = 1; days <= 5; days++) {

const d = new Date(today);

d.setDate(
d.getDate() - days
);

dateList.appendChild(
await loadDate(d, days)
);

}

} catch (e) {

console.error(e);

dateList.innerHTML =
'<div class="error">Unable to load old charts right now.</div>';

}

}

loadCharts();

</script>

</body>
</html>
